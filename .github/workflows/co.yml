name: Checkout permission test
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  checkout-under-pr-write:
    permissions:
      pull-requests: write
    if: github.event.issue.pull_request
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: 75dcb8a9dd3d961b297d9ff132b48f4807eed9b2
          fetch-depth: 0
      - run: |
          ls -la
          echo OK-CHECKOUT
