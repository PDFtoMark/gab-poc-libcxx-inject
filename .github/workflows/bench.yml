# Minimal reproduction of the libcxx-run-benchmarks injection (runs-on changed
# to a GitHub-hosted runner because the original uses a self-hosted label).
name: Benchmark libc++ PoC

permissions:
  contents: read

on:
  issue_comment:
    types:
      - created
      - edited

jobs:
  run-benchmarks:
    permissions:
      pull-requests: write
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/libcxx-bot benchmark')
    runs-on: ubuntu-24.04
    steps:
      - name: Extract information from the PR
        id: vars
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          echo "pr_head=0000000000000000000000000000000000000000" >> ${GITHUB_OUTPUT}
          echo "pr_base=0000000000000000000000000000000000000000" >> ${GITHUB_OUTPUT}
          BENCHMARKS=$(echo "$COMMENT_BODY" | sed -nE 's/\/libcxx-bot benchmark (.+)/\1/p')
          echo "benchmarks=${BENCHMARKS}" >> ${GITHUB_OUTPUT}

      - name: Show parsed outputs
        run: |
          echo "parsed: [${{ steps.vars.outputs.benchmarks }}]"

      - name: Run candidate
        run: |
          echo "--- entered Run candidate step ---"
          /bin/echo --param optimization=speed ${{ steps.vars.outputs.benchmarks }}
          echo "--- finished Run candidate step ---"
